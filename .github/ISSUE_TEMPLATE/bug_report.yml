name: Bug report
description: Something in @pimbay/search-query-drizzle isn't working as documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected instead, and what actually happened.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal schema + adapter/condition-builder call that reproduces it.
      render: typescript
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package version (and drizzle-orm version)
    validations:
      required: true
