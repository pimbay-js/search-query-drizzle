name: Merge contrib into main

on:
  push:
    branches: [contrib]

jobs:
  merge:
    runs-on: codeberg-tiny
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_MERGE_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "pimbay-bot"
          git config user.email "dev@pimbay.dev"

      - name: Merge contrib into main
        run: |
          git fetch origin main contrib
          git checkout main
          git merge --no-ff origin/contrib -m "chore: merge contrib into main"
          git push origin main

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Tag release if version manifest carries an untagged version
        id: tag
        run: |
          if [ -f package.json ]; then
            VERSION="$(node -p "require('./package.json').version")"
          elif [ -f VERSION ]; then
            VERSION="$(cat VERSION)"
          else
            echo "no version manifest found (package.json or VERSION) — skipping tag" >&2
            echo "new_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$VERSION" ] || [ "$VERSION" = "0.0.0" ]; then
            echo "no releasable version (missing, or 0.0.0 placeholder) — skipping tag" >&2
            echo "new_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="v${VERSION}"

          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "${TAG} already exists on Codeberg — nothing to do"
            echo "new_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"
          echo "new_tag=true" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Sync main and tags to GitHub
        run: |
          git remote add github "https://x-access-token:${{ secrets.GH_PUSH_TOKEN }}@github.com/pimbay-js/search-query-drizzle.git"
          git push github main
          git push github --tags

      - name: Install dependencies
        if: steps.tag.outputs.new_tag == 'true'
        run: npm install

      - name: Build
        if: steps.tag.outputs.new_tag == 'true'
        run: npm run js:build

      - name: Publish to npm
        if: steps.tag.outputs.new_tag == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
