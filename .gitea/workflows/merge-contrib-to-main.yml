name: Merge contrib into main

on:
  push:
    branches: [contrib]

jobs:
  merge:
    runs-on: codeberg-tiny
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_MERGE_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "pimbay-bot"
          git config user.email "dev@pimbay.dev"

      - name: Merge contrib into main
        run: |
          git fetch origin main contrib
          git checkout main
          git merge --no-ff origin/contrib -m "chore: merge contrib into main"
          git push origin main

      - name: Sync main to GitHub
        run: |
          git remote add github "https://x-access-token:${{ secrets.GH_PUSH_TOKEN }}@github.com/pimbay-js/search-query-drizzle.git"
          git push github main

      - name: Read the releasable version
        id: release
        run: |
          if [ ! -f VERSION ]; then
            echo "no VERSION file — nothing to release" >&2
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="$(cat VERSION | tr -d '[:space:]')"

          if [ -z "$VERSION" ] || [ "$VERSION" = "0.0.0" ]; then
            echo "no releasable version (missing, or 0.0.0 placeholder)" >&2
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PACKAGE_VERSION="$(sed -n 's/^  "version": "\([^"]*\)".*/\1/p' package.json)"

          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "VERSION says ${VERSION} but package.json says ${PACKAGE_VERSION} — refusing to release" >&2
            exit 1
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.release.outputs.release == 'true'
        run: npm install

      - name: Build
        if: steps.release.outputs.release == 'true'
        run: npm run js:build

      - name: Publish to npm
        if: steps.release.outputs.release == 'true'
        run: |
          PACKAGE="$(node -p "require('./package.json').name")"
          VERSION="${{ steps.release.outputs.version }}"

          if npm view "${PACKAGE}@${VERSION}" version > /dev/null 2>&1; then
            echo "${PACKAGE}@${VERSION} is already on npm — nothing to publish"
            exit 0
          fi

          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN secret is not set — cannot publish to npm" >&2
            exit 1
          fi

          npm config set "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}"
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag release
        if: steps.release.outputs.release == 'true'
        run: |
          TAG="${{ steps.release.outputs.tag }}"

          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "${TAG} already exists on Codeberg — nothing to do"
            exit 0
          fi

          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"

      - name: Sync tags to GitHub
        if: steps.release.outputs.release == 'true'
        run: git push github --tags
